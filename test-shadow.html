<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: monospace;
      background: #f0f0f0;
      display: flex;
      gap: 20px;
    }

    #canvas-container {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      border: 1px solid #ddd;
    }

    #controls {
      width: 300px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .control-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
    }

    input[type="color"] {
      width: 100%;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    .value-display {
      display: inline-block;
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 10px;
    }

    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas" width="600" height="600"></canvas>
  </div>

  <div id="controls">
    <h2>🎨 Shadow Controls</h2>

    <div class="control-group">
      <label>
        Blur
        <span class="value-display" id="blur-value">27</span>
      </label>
      <input type="range" id="blur" min="0" max="200" value="27" step="1">
    </div>

    <div class="control-group">
      <label>
        Spread
        <span class="value-display" id="spread-value">0</span>
      </label>
      <input type="range" id="spread" min="0" max="100" value="0" step="1">
    </div>

    <div class="control-group">
      <label>Color</label>
      <input type="color" id="color" value="#000000">
    </div>

    <div class="control-group">
      <label>
        Opacity
        <span class="value-display" id="opacity-value">0.5</span>
      </label>
      <input type="range" id="opacity" min="0" max="1" value="0.5" step="0.01">
    </div>

    <div class="control-group">
      <label>
        Offset X
        <span class="value-display" id="offsetx-value">-2</span>
      </label>
      <input type="range" id="offsetx" min="-300" max="300" value="-2" step="1">
    </div>

    <div class="control-group">
      <label>
        Offset Y
        <span class="value-display" id="offsety-value">10</span>
      </label>
      <input type="range" id="offsety" min="-300" max="300" value="10" step="1">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Load coin image
    const coinImage = new Image();
    coinImage.src = 'assets/1_04.png';

    // Flag to track if image loaded
    let imageLoaded = false;
    coinImage.onload = () => {
      console.log('✅ Coin image loaded successfully!', coinImage.width, 'x', coinImage.height);
      imageLoaded = true;
      draw();
    };
    coinImage.onerror = (e) => {
      console.error('❌ Image failed to load:', e);
      console.warn('Using fallback circle');
      imageLoaded = false;
      draw();
    };

    // Also log when we start loading
    console.log('🔄 Loading coin image from:', coinImage.src);

    // Shadow config
    const shadowConfig = {
      blur: 27,
      spread: 0,
      color: '#000000',
      opacity: 0.5,
      offsetX: -2,
      offsetY: 10
    };

    // Update value displays
    function updateDisplays() {
      document.getElementById('blur-value').textContent = shadowConfig.blur;
      document.getElementById('spread-value').textContent = shadowConfig.spread;
      document.getElementById('opacity-value').textContent = shadowConfig.opacity;
      document.getElementById('offsetx-value').textContent = shadowConfig.offsetX;
      document.getElementById('offsety-value').textContent = shadowConfig.offsetY;
    }

    // Setup event listeners
    document.getElementById('blur').addEventListener('input', (e) => {
      shadowConfig.blur = parseFloat(e.target.value);
      updateDisplays();
      draw();
    });

    document.getElementById('spread').addEventListener('input', (e) => {
      shadowConfig.spread = parseFloat(e.target.value);
      updateDisplays();
      draw();
    });

    document.getElementById('color').addEventListener('input', (e) => {
      shadowConfig.color = e.target.value;
      draw();
    });

    document.getElementById('opacity').addEventListener('input', (e) => {
      shadowConfig.opacity = parseFloat(e.target.value);
      updateDisplays();
      draw();
    });

    document.getElementById('offsetx').addEventListener('input', (e) => {
      shadowConfig.offsetX = parseFloat(e.target.value);
      updateDisplays();
      draw();
    });

    document.getElementById('offsety').addEventListener('input', (e) => {
      shadowConfig.offsetY = parseFloat(e.target.value);
      updateDisplays();
      draw();
    });

    // Convert hex to rgba
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // Draw function
    function draw() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background grid for visibility
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center position
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 80;

      ctx.save();
      ctx.translate(centerX, centerY);

      // STEP 1: Draw shadow-casting circle (invisible but casts shadow)
      // Simulate spread by drawing shadow layers first
      if (shadowConfig.spread > 0) {
        const spreadSteps = Math.ceil(shadowConfig.spread / 5);
        for (let i = 0; i < spreadSteps; i++) {
          const spreadAmount = (i + 1) * 5;
          const spreadAlpha = shadowConfig.opacity * (1 - (i / spreadSteps) * 0.3);

          ctx.shadowBlur = shadowConfig.blur + spreadAmount;
          ctx.shadowColor = hexToRgba(shadowConfig.color, spreadAlpha * 0.3);
          ctx.shadowOffsetX = shadowConfig.offsetX;
          ctx.shadowOffsetY = shadowConfig.offsetY;

          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,0)';
          ctx.fill();
        }
      }

      // Apply main shadow settings and draw invisible circle to cast shadow
      ctx.shadowBlur = shadowConfig.blur;
      ctx.shadowColor = hexToRgba(shadowConfig.color, shadowConfig.opacity);
      ctx.shadowOffsetX = shadowConfig.offsetX;
      ctx.shadowOffsetY = shadowConfig.offsetY;

      // Draw invisible circle that will cast the shadow
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fill();

      // STEP 2: Turn off shadow and draw the actual coin on top
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      // Draw coin (clipped to circle) - coin stays same size
      if (imageLoaded && coinImage.complete) {
        console.log('🎨 Drawing coin image');
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.clip();

        const diameter = radius * 2;
        const aspectRatio = coinImage.width / coinImage.height;
        const imgWidth = diameter;
        const imgHeight = diameter / aspectRatio;

        ctx.drawImage(coinImage, -imgWidth/2, -imgHeight/2, imgWidth, imgHeight);
        ctx.restore();
      } else {
        console.log('⚠️ Using fallback - imageLoaded:', imageLoaded, 'complete:', coinImage.complete);
        // Fallback circle if image not loaded - make it more visible
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Add $ symbol to make it look like a coin
        ctx.fillStyle = '#8B7355';
        ctx.font = 'bold 60px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 0);
      }

      // Reset shadow
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      ctx.restore();
    }

    // Draw immediately with fallback (will show $ coin until image loads)
    draw();
  </script>
</body>
</html>
