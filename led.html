<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFCM LED Screen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/led-styles.css">
</head>
<body>
    <div class="led-dashboard" id="led-dashboard">
        <!-- Standard 16:9 strips video (rendered first, z-index -1) -->
        <video class="led-background-video led-background-standard"
               id="standard-video"
               autoplay
               loop
               muted
               playsinline
               webkit-playsinline
               onloadedmetadata="this.muted = true"
               preload="auto">
            <source src="assets/16-9-Screen.mp4" type="video/mp4">
        </video>

        <!-- Ultrawide animated video background (rendered second, z-index -2) -->
        <video class="led-background-video led-background-ultrawide"
               id="ultrawide-video"
               autoplay
               loop
               muted
               playsinline
               webkit-playsinline
               onloadedmetadata="this.muted = true"
               preload="auto">
            <source src="assets/Animated_Bord.mp4" type="video/mp4">
        </video>

        <!-- Standard 16:9 drop shadow overlay -->
        <img src="assets/16-9-dropshadow.png"
             class="led-dropshadow-overlay"
             id="standard-dropshadow"
             alt="Drop shadow overlay">

        <!-- Pins overlay - stretches over entire background -->
        <img src="assets/Pins.png" class="led-pins-overlay" alt="Pins overlay">

        <!-- All elements will be dynamically created by LayoutManager -->
        <!-- Element containers are positioned absolutely by the layout system -->

        <!-- Glass overlay - topmost layer -->
        <!-- <img src="assets/Glass.png" class="led-glass-overlay" alt="Glass overlay"> -->
    </div>

    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.min.js"></script>

    <!-- Dashboard Application -->
    <script type="module" src="js/led-dashboard.js"></script>
</body>
</html>
