# Docker Compose for Internal BFCM Proxy
version: '3.8'

services:
  bfcm-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: bfcm-proxy
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - PORT=8080
      - TARGET_API=https://wix-bo.com/_api/bfcm-dashboard-serverless
      # Optional: Set API_KEY for authentication
      # - API_KEY=your-secret-key-here

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
