<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFCM Dashboard - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 3rem;
        }
        .dashboard-links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem 3rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            min-width: 250px;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            border-color: #4facfe;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .card-description {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BFCM Dashboard</h1>
        <p class="subtitle">Choose your dashboard view</p>
        
        <div class="dashboard-links">
            <a href="dashboard.html" class="dashboard-card">
                <div class="card-icon">📊</div>
                <div class="card-title">Admin Dashboard</div>
                <div class="card-description">Full-featured dashboard with controls</div>
            </a>
            
            <a href="led.html" class="dashboard-card">
                <div class="card-icon">🖥️</div>
                <div class="card-title">LED Screen</div>
                <div class="card-description">Optimized for large display screens</div>
            </a>
        </div>
    </div>
</body>
</html>
